[profile.default]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./data" }]
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 32
max_test_rejects = 65536

[rpc_endpoints]
base_mainnet = "${BASE_MAINNET_RPC_URL}"

# Base pans on isthmus op-fee scalar in fork tests with foundry 1.7.1's revm;
# pinning the evm_version to cancun (the spec's own §6.7 evm_version) keeps
# fork tests on the pre-isthmus fee path.
